[project]
name = "etf-quant"
version = "0.1.0"
description = "ETF quantitative research platform"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "akshare",
    "requests",
    "joblib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
ml = ["torch"]
fetch = ["akshare", "requests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
